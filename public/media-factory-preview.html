            <div className="pointer-events-none absolute -top-20 -right-20 w-[300px] h-[300px] bg-white/20 rounded-full blur-[90px]"></div>
            <div className="pointer-events-none absolute -bottom-20 -left-20 w-[300px] h-[300px] bg-amber-200/20 rounded-full blur-[90px]"></div>
            <div className="relative">
              <div className="flex flex-wrap items-start justify-between gap-8">
                <div className="max-w-[560px]">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/15 border border-white/20 text-white text-[11px]"><Icon path={I.sparkles} className="w-3.5 h-3.5" /> FACTORY READY • Veo 3 + Imagen 4 + Gemini</div>
                  <h2 className="mt-4 text-white text-[32px] sm:text-[42px] font-bold tracking-[-0.03em] leading-[0.95]">Your Flow is a film.<br />Your film is a SaaS.</h2>
                  <p className="mt-3 text-white/80 text-[15px] leading-[1.5] max-w-[480px]">Build 1000 films like Flow but as your own factory — prompt once, extend infinitely, sell as SaaS. Character consistency locked.</p>

                <div className="w-full lg:w-[420px]">

                    <input value={prompt} onChange={(e) => setPrompt(e.target.value)} placeholder="Describe your film (crypto founder in Tokyo...)" className="flex-1 h-11 px-4 rounded-full bg-[#f5f5f7] border border-black/5 text-[13px] outline-none focus:border-fuchsia-300 focus:bg-white transition min-w-0" />
                    <button onClick={() => notify("Factory building: " + prompt)} className="h-11 px-5 rounded-full bg-black text-white text-[13px] font-semibold flex items-center gap-1.5 hover:bg-zinc-900 transition shrink-0"><Icon path={I.film} className="w-4 h-4" /> Create Film</button>
                  </div>
                  <div className="mt-3 flex flex-wrap gap-2">
                    {["crypto founder Tokyo", "dental clinic ad", "SaaS factory $10k MRR"].map((v) => (
                      <button key={v} onClick={() => setPrompt(v)} className="px-3 py-1 rounded-full bg-white/15 border border-white/20 text-white text-[11px] hover:bg-white/25 transition">{v}</button>
                    ))}
                  </div>
                  <div className="mt-4 text-white/70 text-[11px]">Build 1000 films like Flow but as your own factory — gysm.io/media-factory</div>
                </div>
              </div>
              <div className="mt-10 flex flex-wrap items-center gap-3 text-white/60 text-[11px]">
                <span className="flex items-center gap-1.5"><span className="w-6 h-6 rounded-full bg-white text-black grid place-items-center font-bold">G</span> GYSM.IO — Concept preview • Factory OS</span>
                <span className="hidden sm:inline">•</span>
                <span>Vibrant by design — white + fuchsia #FF0080 / violet #8b5cf6 / cyan #06b6d4</span>

      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 rounded-full bg-black text-white text-[13px] font-medium shadow-[0_12px_32px_rgba(0,0,0,0.25)] flex items-center gap-2 max-w-[90vw]">
          <span className="w-5 h-5 rounded-full bg-gradient-to-r from-[#FF0080] to-[#8b5cf6] grid place-items-center shrink-0"><Icon path={I.check} className="w-3 h-3" /></span>
          <span className="truncate">{toast}</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
</body>
