const { useState, useEffect, useRef, useMemo } = React;

/* ------------------------------------------------------------------ */

    case "video": return <svg {...common}><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 10l5-3v10l-5-3"/></svg>;
    case "user": return <svg {...common}><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>;
    case "file": return <svg {...common}><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>;
    case "captions": return <svg {...common}><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 12h1M11 12h6M7 15h4M13 15h4"/></svg>;

    case "sparkles": return <svg {...common}><path d="M12 3l1.8 4.9L19 9.5l-5.2 1.6L12 16l-1.8-4.9L5 9.5l5.2-1.6L12 3z"/><path d="M19 15l.7 1.9L21.5 17.5l-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.6z"/></svg>;
    case "play": return <svg {...common} fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>;
    case "plus": return <svg {...common}><path d="M12 5v14M5 12h14"/></svg>;
    case "search": return <svg {...common}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>;
    case "check": return <svg {...common}><path d="M20 6L9 17l-5-5"/></svg>;
    case "gear": return <svg {...common}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>;

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/* Progress bar used by every generation card                         */
/* ------------------------------------------------------------------ */
function useSimulatedProgress(durationMs, onDone, skip) {
  const [progress, setProgress] = useState(skip ? 100 : 0);
  const doneRef = useRef(!!skip);
  useEffect(() => {
    if (skip) return;
    const start = Date.now();
    const tick = setInterval(() => {
      const pct = Math.min(100, Math.round(((Date.now() - start) / durationMs) * 100));
      setProgress(pct);
      if (pct >= 100 && !doneRef.current) {
        doneRef.current = true;
        clearInterval(tick);
        onDone && onDone();
      }
    }, 60);
    return () => clearInterval(tick);
  }, []);
  return progress;
}

function ProgressBar({ progress }) {
  return (
    <div className="h-1.5 w-full rounded-full bg-white/[0.08] overflow-hidden">
      <div className="h-full rounded-full bg-[#FF0080] fuchsia-glow-sm transition-all duration-150" style={{ width: progress + "%" }} />
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Placeholder preview box -- clearly labeled as a demo placeholder,  */
/* not a real generated asset (no real image/video model is wired up  */
/* in this prototype).                                                */
/* ------------------------------------------------------------------ */
function PlaceholderMedia({ kind, label, className }) {
  return (
    <div className={"relative rounded-xl overflow-hidden border border-white/10 bg-gradient-to-br from-[#1a0a14] via-[#0f0f14] to-[#08080a] flex items-center justify-center " + (className || "")}>

        <span className="text-[10px] font-semibold uppercase tracking-wide">{label || "Demo placeholder"}</span>
      </div>
      {kind === "video" && (
        <div className="absolute inset-0 flex items-center justify-center">
          <div className="w-12 h-12 rounded-full bg-[#FF0080] fuchsia-glow-sm flex items-center justify-center">
            <Icon name="play" className="w-5 h-5 text-white" />
          </div>
        </div>
      )}
    </div>
  );
}

function ActionPill({ children, onClick }) {
  return (
    <button
      onClick={onClick}
      className="h-7 px-3 rounded-full bg-white/[0.06] border border-white/10 text-[11px] font-semibold text-white/70 hover:bg-white/10 hover:text-white transition-colors duration-150"
    >
      {children}
    </button>
  );
}

/* ---------------------------- @media card --------------------------*/
function MediaGenCard({ msg, onComplete, onAction }) {
  const [done, setDone] = useState(msg.done || false);
  const rawProgress = useSimulatedProgress(2800, () => { if (!done) { setDone(true); onComplete(msg.id); } }, done);
  const progress = done ? 100 : rawProgress;
  return (
    <div className="rounded-2xl border border-white/10 bg-[#0f0f14] p-4 max-w-[420px]">
      <div className="text-[12px] font-semibold text-white/80 mb-2">{msg.agent} {done ? "— done" : "generating…"}</div>
      {!done && <ProgressBar progress={progress} />}
      {done && (
        <React.Fragment>
          <PlaceholderMedia kind="image" label="Image preview (demo)" className="w-full aspect-video mb-3" />
          <div className="flex flex-wrap gap-2">
            <ActionPill onClick={() => onAction("Use as Hero")}>Use as Hero</ActionPill>
            <ActionPill onClick={() => onAction("Remove BG")}>Remove BG</ActionPill>
            <ActionPill onClick={() => onAction("Extend to 9:16")}>Extend to 9:16</ActionPill>
            <ActionPill onClick={() => onAction("Upscale 4K")}>Upscale 4K</ActionPill>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

          <button key={r} onClick={() => setRatio(r)} className={"h-7 px-3 rounded-full text-[11px] font-semibold border transition-all duration-200 " + (ratio === r ? "border-[#FF0080] bg-[#FF0080]/10 text-white" : "border-white/10 text-white/50 hover:text-white")}>

function AudioGenCard({ msg, onComplete }) {
  const [done, setDone] = useState(msg.done || false);
  const rawProgress = useSimulatedProgress(2400, () => { if (!done) { setDone(true); onComplete(msg.id); } }, done);
  const progress = done ? 100 : rawProgress;
  const bars = useMemo(() => Array.from({ length: 28 }).map(() => 8 + Math.round(Math.random() * 28)), [done]);
  return (
    <div className="rounded-2xl border border-white/10 bg-[#0f0f14] p-4 max-w-[420px]">
      <div className="text-[12px] font-semibold text-white/80 mb-2">{msg.agent} {done ? "— done" : "generating…"}</div>
      {!done && <ProgressBar progress={progress} />}
      {done && (
        <div className="flex items-end gap-[3px] h-14 px-1">
          {bars.map((h, i) => (
            <div key={i} className="w-1.5 rounded-full bg-[#FF0080]/70" style={{ height: h + "px" }} />
          ))}
        </div>
      )}
    </div>
  );
}

function matchAgentId(cat, item) {
  const inCat = AGENTS.filter((a) => a.cat === cat);
  const lower = (item || "").toLowerCase();
  const hit = inCat.find((a) => lower.includes(a.name.toLowerCase().split(" ")[0].toLowerCase()));
  return (hit || inCat[0] || AGENTS[0]).id;
}

function Message({ msg, onUpdate, onLogGeneration, onAppendMessage }) {
  if (msg.role === "user") {
    return (
      <div className="flex justify-end">
        <div className="max-w-[75%] rounded-2xl rounded-tr-sm bg-white text-[#08080a] px-4 py-2.5 text-[13px] leading-relaxed">
          {msg.tag && <span className="inline-block mr-1.5 px-2 py-0.5 rounded-full bg-[#FF0080]/10 text-[#FF0080] text-[10px] font-bold align-middle">{msg.tag}</span>}
          {msg.text}
        </div>
      </div>
    );
  }

  return (
    <div className="flex items-start gap-2.5">
      <div className="w-7 h-7 rounded-full bg-[#FF0080] fuchsia-glow-sm flex items-center justify-center text-[11px] font-bold shrink-0 mt-0.5">G</div>
      <div className="flex-1">
        {msg.kind === "text" && (
          <div className="max-w-[75%] rounded-2xl rounded-tl-sm bg-[#0f0f14] border border-white/10 px-4 py-2.5 text-[13px] leading-relaxed text-white/80 whitespace-pre-wrap">
            {msg.text}
          </div>
        )}
        {msg.kind === "media-gen" && (
          <MediaGenCard
            msg={msg}
            onComplete={(id) => { onUpdate(id, { done: true }); onLogGeneration({ cat: "media", item: msg.agent }); }}
            onAction={(action) => {
              if (action === "Extend to 9:16") onAppendMessage({ id: uid(), role: "assistant", kind: "text", text: "Extended to 9:16 (demo) — export from the Preview tab." });
              if (action === "Remove BG") onAppendMessage({ id: uid(), role: "assistant", kind: "text", text: "Background removed (demo)." });
              if (action === "Upscale 4K") onAppendMessage({ id: uid(), role: "assistant", kind: "text", text: "Upscaled to 4K (demo)." });
              if (action === "Use as Hero") onAppendMessage({ id: uid(), role: "assistant", kind: "text", text: "Set as hero image for this build." });
            }}
          />
        )}
        {msg.kind === "video-gen" && (
          <VideoGenCard
            msg={msg}
            appliedCaption={msg.appliedCaption}
            onComplete={(id) => { onUpdate(id, { done: true }); onLogGeneration({ cat: "video", item: msg.agent }); }}
            onAction={(action) => {
              if (action === "Add Captions") onAppendMessage({ id: uid(), role: "assistant", kind: "captions-row", forId: msg.id });
              if (action === "Cut to Shorts") onAppendMessage({ id: uid(), role: "assistant", kind: "shorts" });
              if (action === "Add Avatar") onAppendMessage({ id: uid(), role: "assistant", kind: "avatar" });
              if (action === "Export") onAppendMessage({ id: uid(), role: "assistant", kind: "text", text: "Queued for export (demo) — wire a real render pipeline to make this download an actual file." });
            }}
          />
        )}
        {msg.kind === "audio-gen" && (
          <AudioGenCard msg={msg} onComplete={(id) => { onUpdate(id, { done: true }); onLogGeneration({ cat: "audio", item: msg.agent }); }} />
        )}
        {msg.kind === "avatar" && (
          <AvatarCard
            msg={msg}
            onGenerate={(id, avatarId, script) => {
              onUpdate(id, { selectedAvatar: avatarId, script });
              onAppendMessage({ id: uid(), role: "assistant", kind: "video-gen", agent: "Talking Avatar", done: false });
              onLogGeneration({ cat: "avatar", item: "Talking Avatar" });
            }}
          />
        )}
        {msg.kind === "captions-row" && (
          <CaptionStylesRow
            applied={msg.applied}
            onApply={(styleKey) => {
              onUpdate(msg.id, { applied: styleKey });
              if (msg.forId) onUpdate(msg.forId, { appliedCaption: styleKey });
              onLogGeneration({ cat: "captions", item: "Auto Captions" });
            }}
          />
        )}
        {msg.kind === "shorts" && (
          <ShortsCard onExport={() => { onAppendMessage({ id: uid(), role: "assistant", kind: "text", text: "3 shorts queued for export (demo)." }); onLogGeneration({ cat: "video", item: "Long Video to Shorts" }); }} />
        )}
        {msg.kind === "edit-card" && <EditCard />}
      </div>
    </div>
  );
}

function fmtDay(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return "Today";
  if (sameDay(d, yest)) return "Yesterday";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function App() {
  const [chats, setChats] = useState(() => loadLS("gysm_chats", []));
  const [activeChatId, setActiveChatId] = useState(() => (chats[0] ? chats[0].id : null));
  const [search, setSearch] = useState("");
  const [input, setInput] = useState("");
  const [openMenu, setOpenMenu] = useState(null);
  const [pickedSkill, setPickedSkill] = useState(null); // {cat, item}
  const [rightTab, setRightTab] = useState("preview");
  const [generations, setGenerations] = useState(() => loadLS("gysm_generations", []));
  const [billing, setBilling] = useState("monthly");

  useEffect(() => { saveLS("gysm_chats", chats); }, [chats]);
  useEffect(() => { saveLS("gysm_generations", generations); }, [generations]);

  useEffect(() => {
    if (chats.length === 0) {
      const c = { id: uid(), title: "New Build", createdAt: Date.now(), messages: [] };
      setChats([c]);
      setActiveChatId(c.id);
    }
  }, []);

  const activeChat = chats.find((c) => c.id === activeChatId) || chats[0];

  function newBuild() {
    const c = { id: uid(), title: "New Build", createdAt: Date.now(), messages: [] };
    setChats((prev) => [c, ...prev]);
    setActiveChatId(c.id);
  }

  function updateMessages(fn) {
    setChats((prev) => prev.map((c) => (c.id === activeChatId ? { ...c, messages: fn(c.messages) } : c)));
  }
  function appendMessage(msg) {
    updateMessages((msgs) => [...msgs, msg]);
  }
  function updateMessage(id, patch) {
    updateMessages((msgs) => msgs.map((m) => (m.id === id ? { ...m, ...patch } : m)));
  }
  function logGeneration({ cat, item }) {
    const agentId = matchAgentId(cat, item);
    setGenerations((prev) => [...prev, { id: uid(), cat, item, agentId, ts: Date.now() }]);
  }

  function handleSend() {
    if (!input.trim() && !pickedSkill) return;
    const text = input.trim() || (pickedSkill ? pickedSkill.item : "");
    const tag = pickedSkill ? pickedSkill.cat.label + " " + pickedSkill.item : null;
    appendMessage({ id: uid(), role: "user", text, tag });

    if (pickedSkill) {
      const cat = pickedSkill.cat.key;
      const item = pickedSkill.item;
      if (cat === "media") appendMessage({ id: uid(), role: "assistant", kind: "media-gen", agent: item, done: false });
      else if (cat === "video") appendMessage({ id: uid(), role: "assistant", kind: "video-gen", agent: item, done: false });
      else if (cat === "audio") appendMessage({ id: uid(), role: "assistant", kind: "audio-gen", agent: item, done: false });
      else if (cat === "avatar") appendMessage({ id: uid(), role: "assistant", kind: "avatar" });
      else if (cat === "captions") appendMessage({ id: uid(), role: "assistant", kind: "captions-row" });
      else if (cat === "edit") appendMessage({ id: uid(), role: "assistant", kind: "edit-card" });
      else if (cat === "script") {
        var scriptLines = [
          "SCRIPT DRAFT (demo)",
          "",
          "Hook: " + text,
          "Beat 1: Show the problem.",
          "Beat 2: Show GYSM solving it.",
          "CTA: Build yours at gysm.io",
        ];
        appendMessage({ id: uid(), role: "assistant", kind: "text", text: scriptLines.join(String.fromCharCode(10)) });
      }
    } else {
      appendMessage({ id: uid(), role: "assistant", kind: "text", text: "Pick an @skill above (media, video, avatar, script, captions, audio, edit) to generate something, or describe the app you want built." });
    }
    setInput("");
    setPickedSkill(null);
  }

  const filteredChats = chats.filter((c) => c.title.toLowerCase().includes(search.toLowerCase()));
  const grouped = filteredChats.reduce((acc, c) => {
    const g = fmtDay(c.createdAt);
    (acc[g] = acc[g] || []).push(c);
    return acc;
  }, {});

  const lastGeneration = generations[generations.length - 1];

  return (
    <div className="h-full w-screen flex bg-[#08080a] text-white overflow-hidden">
      {/* LEFT: history */}
      <div className="w-[300px] shrink-0 bg-[#0a0a0d] border-r border-white/[0.06] flex flex-col">
        <div className="p-3">
          <button onClick={newBuild} className="w-full h-9 rounded-full bg-gradient-to-r from-[#FF0080] to-[#e0117a] text-white text-[13px] font-bold flex items-center justify-center gap-1.5 fuchsia-glow-sm hover:opacity-90 transition-all duration-200">
            <Icon name="plus" className="w-4 h-4" /> New Build
          </button>
        </div>
        <div className="px-3 pb-2">
          <div className="flex items-center gap-2 h-8 rounded-lg bg-white/[0.05] border border-white/10 px-2.5">
            <Icon name="search" className="w-3.5 h-3.5 text-white/30" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search builds…" className="bg-transparent outline-none text-[12px] text-white placeholder:text-white/30 w-full" />
          </div>
        </div>
        <div className="flex-1 overflow-y-auto px-2 pb-3">
          {Object.entries(grouped).map(([group, list]) => (
            <div key={group} className="mb-3">
              <div className="px-2 py-1 text-[10px] font-bold uppercase tracking-wide text-white/30">{group}</div>
              {list.map((c) => (
                <button
                  key={c.id}
                  onClick={() => setActiveChatId(c.id)}
                  className={"w-full text-left px-2.5 py-2 rounded-lg text-[12.5px] truncate transition-colors duration-150 " + (c.id === activeChatId ? "bg-[#FF0080]/10 text-white" : "text-white/60 hover:bg-white/[0.05] hover:text-white")}
                >
                  {c.title}
                </button>
              ))}
            </div>
          ))}
        </div>
      </div>

      {/* CENTER: chat */}
      <div className="flex-1 flex flex-col bg-[#08080a] min-w-0">
        <div className="h-14 shrink-0 border-b border-white/[0.06] flex items-center px-5">
          <span className="font-black tracking-tight text-[14px]">GYSM<span className="text-[#FF0080]">.IO</span> <span className="text-white/30 font-medium">/ Media Factory</span></span>
        </div>
        <div className="flex-1 overflow-y-auto px-6 py-6 space-y-4">
          {(activeChat ? activeChat.messages : []).length === 0 && (
            <div className="h-full flex flex-col items-center justify-center text-center text-white/30 gap-2">
              <Icon name="sparkles" className="w-8 h-8 text-[#FF0080]" />
              <p className="text-[13px]">Pick a skill below (@media, @video, @avatar…) and describe what you want.</p>
            </div>
          )}
          {(activeChat ? activeChat.messages : []).map((m) => (
            <Message key={m.id} msg={m} onUpdate={updateMessage} onLogGeneration={logGeneration} onAppendMessage={appendMessage} />
          ))}
        </div>
        <div className="shrink-0 border-t border-white/[0.06] px-5 pt-3 pb-4 bg-[#08080a]">
          {pickedSkill && (
            <div className="mb-2 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#FF0080]/15 border border-[#FF0080]/40 text-[11px] font-semibold text-[#FF0080]">
              {pickedSkill.cat.label} {pickedSkill.item}
              <button onClick={() => setPickedSkill(null)} className="text-[#FF0080]/60 hover:text-white">×</button>
            </div>
          )}
          <SkillChips openMenu={openMenu} setOpenMenu={setOpenMenu} onPick={(cat, item) => setPickedSkill({ cat, item })} />
          <div className="flex items-end gap-2">
            <textarea
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
              placeholder="Describe what you want, or just pick a skill above and hit send…"
              className="flex-1 h-11 max-h-32 rounded-2xl bg-[#0f0f14] border border-white/10 px-4 py-2.5 text-[13px] text-white placeholder:text-white/30 outline-none resize-none focus:border-[#FF0080]/50 transition-colors duration-200"
            />
            <button onClick={handleSend} className="h-11 px-5 rounded-2xl bg-[#FF0080] text-white text-[13px] font-bold hover:bg-[#FF0080]/90 fuchsia-glow-sm transition-all duration-200">
              Send
            </button>
          </div>
        </div>
      </div>

      {/* RIGHT: artifact panel */}
      <div className="w-[420px] shrink-0 bg-[#0a0a0d] border-l border-white/[0.06] flex flex-col">
        <div className="h-14 shrink-0 border-b border-white/[0.06] flex items-center px-4 gap-1">
          {["preview", "code", "deploy", "agents"].map((t) => (
            <button
              key={t}
              onClick={() => setRightTab(t)}
              className={"h-full px-3 text-[12px] font-semibold capitalize border-b-2 transition-colors duration-200 " + (rightTab === t ? "text-white border-[#FF0080]" : "text-white/40 border-transparent hover:text-white/70")}
            >
              {t}
            </button>
          ))}
        </div>
        <div className="flex-1 overflow-y-auto p-4">
          {rightTab === "preview" && <PreviewTab lastGeneration={lastGeneration} />}
          {rightTab === "code" && <CodeTab />}
          {rightTab === "deploy" && <DeployTab billing={billing} setBilling={setBilling} />}
          {rightTab === "agents" && <AgentsTab generations={generations} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
