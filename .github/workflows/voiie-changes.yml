# Applies website-change requests that leads sent by email ("add my logo")
# to their demo site and emails them the updated link. Needs the same
# CRON_SECRET repo secret as voiie-hunt.yml, and VOIIE_AUTOCHANGE=1 in Vercel.
name: voiie-changes
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Apply pending changes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          curl -sS --max-time 280 -H "Authorization: Bearer $CRON_SECRET" https://www.gysm.io/api/voiie/cron/changes
