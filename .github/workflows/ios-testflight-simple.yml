name: iOS TestFlight (automatic signing)

# Simplest route to TestFlight that needs no Codemagic, no fastlane match repo
# and no certificate files. Xcode signs automatically using an App Store
# Connect API key: it creates or reuses the distribution certificate and the
# App Store profile for io.gysm.app, then uploads the build.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID       Key ID of the App Store Connect API key
#   ASC_ISSUER_ID    Issuer ID shown on the same page
#   ASC_KEY_CONTENT  the .p8 file, base64-encoded
# The key needs the Admin role the first time (to create the certificate).

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (uncheck to only build and keep the .ipa)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: FJU33P8JUF
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS deps and sync Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Put the App Store Connect key on the runner
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -e
          KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ISSUER="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          [ -n "$KEY_ID" ] || { echo "::error::Secret ASC_KEY_ID is empty"; exit 1; }
          [ -n "$ISSUER" ] || { echo "::error::Secret ASC_ISSUER_ID is empty"; exit 1; }
          [ -n "$ASC_KEY_CONTENT" ] || { echo "::error::Secret ASC_KEY_CONTENT is empty"; exit 1; }
          echo "Key ID length: ${#KEY_ID} (expected 10), Issuer ID length: ${#ISSUER} (expected 36)"
          DIR="$RUNNER_TEMP/asc"
          mkdir -p "$DIR"
          KEY_PATH="$DIR/AuthKey_${KEY_ID}.p8"
          # Accept either the base64 of the .p8 or the raw PEM text.
          if printf '%s' "$ASC_KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_CONTENT" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_CONTENT" | tr -d '[:space:]' | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          if ! head -n1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_KEY_CONTENT did not decode to a .p8 key. Re-copy it with the Set-Clipboard command and save the secret again."
            exit 1
          fi
          openssl pkey -in "$KEY_PATH" -noout || { echo "::error::The key file is not a valid private key (truncated paste?)"; exit 1; }
          echo "Key file OK ($(wc -c < "$KEY_PATH") bytes)"
          {
            echo "ASC_KEY_PATH=$KEY_PATH"
            echo "ASC_KEY_ID_CLEAN=$KEY_ID"
            echo "ASC_ISSUER_CLEAN=$ISSUER"
          } >> "$GITHUB_ENV"

      - name: Set the build number
        run: cd ios/App && xcrun agvtool new-version -all "${{ github.run_number }}"

      # The archive is built UNSIGNED. A signed archive makes Xcode ask for an
      # iOS *development* profile, which needs at least one registered device
      # ("Your team has no devices from which to generate a provisioning
      # profile"). The export step below signs it for the App Store instead,
      # which needs no devices.
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export (and upload to TestFlight)
        run: |
          DEST=export
          if [ "${{ github.event.inputs.upload }}" = "true" ]; then DEST=upload; fi
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>${DEST}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ios \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID_CLEAN" \
            -authenticationKeyIssuerID "$ASC_ISSUER_CLEAN"

      - name: Keep the .ipa and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gysm-ios-build
          path: |
            build/ios/*.ipa
            build/ios/*.log
          if-no-files-found: ignore
