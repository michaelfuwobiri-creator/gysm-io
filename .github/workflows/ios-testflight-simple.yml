name: iOS TestFlight (automatic signing)

# Simplest route to TestFlight that needs no Codemagic, no fastlane match repo
# and no certificate files. Xcode signs automatically using an App Store
# Connect API key: it creates or reuses the distribution certificate and the
# App Store profile for io.gysm.app, then uploads the build.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID       Key ID of the App Store Connect API key
#   ASC_ISSUER_ID    Issuer ID shown on the same page
#   ASC_KEY_CONTENT  the .p8 file, base64-encoded
# The key needs the Admin role the first time (to create the certificate).

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (uncheck to only build and keep the .ipa)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: FJU33P8JUF
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS deps and sync Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Put the App Store Connect key on the runner
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Set the build number
        run: cd ios/App && xcrun agvtool new-version -all "${{ github.run_number }}"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export (and upload to TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DEST=export
          if [ "${{ github.event.inputs.upload }}" = "true" ]; then DEST=upload; fi
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>${DEST}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ios \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Keep the .ipa and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gysm-ios-build
          path: |
            build/ios/*.ipa
            build/ios/*.log
          if-no-files-found: ignore
