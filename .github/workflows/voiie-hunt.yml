# Calls the VOIIE hunt endpoint every hour so lead-hunting runs around the
# clock (Vercel's own cron here is daily). Needs the repo secret CRON_SECRET,
# set to the same value as the CRON_SECRET env var in Vercel. The endpoint
# only rotates searches when VOIIE_HUNT_ROTATE=1 is set in Vercel, and stops
# on its own at the daily lead cap or when the kill switch is on.
name: voiie-hunt
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run hunt
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          curl -sS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" https://www.gysm.io/api/voiie/cron/hunt
