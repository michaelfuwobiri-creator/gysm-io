name: iOS TestFlight build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (uncheck to just smoke-test the build)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (and optionally upload to TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: FJU33P8JUF
        run: |
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then
            bundle exec fastlane ios build_only
          else
            bundle exec fastlane ios beta
          fi

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gysm-ios-build
          path: build/ios/*.ipa
          if-no-files-found: ignore
